filebeat.inputs:
  - type: filestream
    id: industry-research-json-logs
    enabled: true
    paths:
      - /logs/*.jsonl
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
          overwrite_keys: true

processors:
  - add_fields:
      target: ""
      fields:
        application: industry-information-assistant

setup.ilm.enabled: false
setup.template.enabled: true
setup.template.name: industry-research-logs
setup.template.pattern: industry-research-logs-*
setup.template.settings:
  index.lifecycle.name: industry-research-logs-30d

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: industry-research-logs-%{+yyyy.MM.dd}

logging.json: true
logging.level: info
