name: frontend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # .npmrc 已设 legacy-peer-deps=true（React 19 + AntD 5 peer 冲突，T29），npm ci 同样生效
      - name: Install dependencies
        run: npm ci

      # ⚠️ 仍**有意**未启用 —— 原因已不再是「依赖 T33/T34」（三者均已 DONE），而是存量违规
      #    不在本硬化计划的 41 张票范围内：`npx eslint .` 现为 **78 errors / 9 warnings**
      #    （T33/T34 已把 89 降到 78），散落在 components/ 与 pages/ 的 legacy 代码
      #    （no-unused-vars / no-explicit-any 等）。启用本步骤会让 CI 立刻变红；
      #    **不得**通过关闭规则来让它变绿。
      #    解除条件：单独立项清理这 78 处，或经裁决接受一份显式 ignore 清单（**已立项为 T42**）。
      #    见 docs/hardening/TRACKER.md「待办 / 未闭合项」P-12。
      # - name: Lint (eslint)
      #   run: npm run lint

      # ✅ 已启用（T43）：原记录的「OutlineApprovalPanel 集成用例时序抖动」经复现定位为
      #    **负载下的假超时** —— 这几条 jsdom 重交互用例（外加 deep-research-integration 的
      #    两条）单条实测就要 2.6–2.9s，距默认 5000ms 超时只剩 1.7 倍余量，CPU 争用时会越过。
      #    复现方式：并行跑 6 份 `npx vitest run`，稳定出现 3–4 例 `Test timed out in 5000ms`。
      #    修法：在 `frontend/vitest.config.ts` 把 testTimeout 放宽到 20000ms（断言与墙钟无关，
      #    唯一涉及计时的用例走 fake timers，故这不是放宽断言）。同样的 6 份并发压力下现为 6/6 全绿。
      - name: Test (vitest)
        run: npm run test

      - name: Build (vite)
        run: npm run build
